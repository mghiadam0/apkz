name: Build Android APK (Chaquopy)

# يبني تطبيق أندرويد حقيقي يشغّل Flask محلياً داخل الهاتف
# (كل البيانات تُخزَّن على الهاتف نفسه، بدون أي سيرفر خارجي).
# شغّله يدوياً من تبويب Actions، والـ APK الناتج يظهر كـ Artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-notes-mobile-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
