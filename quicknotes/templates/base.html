<!doctype html><html lang="{{lang}}" dir="{{dir}}" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2783de"><title>{% block title %}{{t('app')}}{% endblock %}</title><link rel="manifest" href="{{url_for('static',filename='manifest.json')}}"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><meta name="csrf-token" content="{{ csrf_token() }}"></head><body><aside class="sidebar"><a class="brand" href="/"><span class="logo">Q</span><span>{{t('app')}}</span></a><nav><a href="/">⌂ <span>{{t('dashboard')}}</span></a><a href="/notes/">▤ <span>{{t('notes')}}</span></a><a href="/calendar">▦ <span>{{t('calendar')}}</span></a><a href="/reminders/">◷ <span>{{t('reminders')}}</span></a><a href="/notes/?view=archive">⌁ <span>{{t('archive')}}</span></a><a href="/notes/?view=trash">♲ <span>{{t('trash')}}</span></a></nav><div class="side-actions"><button id="theme" class="icon-btn" aria-label="Theme">◐</button><select id="language" aria-label="Language"><option value="ar" {% if lang=='ar'%}selected{%endif%}>العربية</option><option value="fr" {% if lang=='fr'%}selected{%endif%}>Français</option><option value="en" {% if lang=='en'%}selected{%endif%}>English</option></select></div></aside><main><header class="topbar"><button class="mobile-menu" aria-label="Menu">☰</button><div class="search"><span>⌕</span><input id="global-search" placeholder="{{t('search')}}" autocomplete="off"></div><button class="primary" data-open-note>＋ {{t('new')}}</button></header><div class="content">{% block content %}{% endblock %}</div></main><button class="fab" data-open-note aria-label="{{t('new')}}">＋</button>
<dialog id="note-dialog"><form id="note-form" method="dialog"><div class="dialog-head"><h2>{{t('new')}}</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></div><label>{{t('title')}}<input name="title" maxlength="180" required autofocus></label><label>{{t('content')}}<textarea name="content" rows="5" maxlength="20000"></textarea></label><div class="form-grid"><label>{{t('category')}}<select name="category_id"><option value="">—</option>{% for c in categories|default([]) %}<option value="{{c.id}}">{{c.icon}} {{c.name}}</option>{% endfor %}</select></label><label>{{t('tags')}}<input name="tags" placeholder="work, urgent"></label><label>Color<select name="color"><option value="#ffffff">White</option><option value="#e5f2fc">Blue</option><option value="#e8f1ec">Green</option><option value="#fbebde">Orange</option><option value="#fce9e7">Red</option><option value="#f3e8ff">Purple</option></select></label><label class="check"><input type="checkbox" name="important"> ⭐ Important</label></div><div class="reminder-box"><label class="check"><input type="checkbox" name="reminder" id="reminder-toggle"> 🔔 {{t('reminders')}}</label><div id="reminder-fields" class="form-grid hidden"><label>{{t('date')}}<input name="date" type="date"></label><label>{{t('time')}}<input name="time" type="time"></label><label>{{t('repeat')}}<select name="repeat"><option value="none">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="custom">Custom days</option></select></label><label>Interval<input name="repeat_interval" type="number" min="1" max="365" value="1"></label></div></div><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button type="submit" class="primary">✓ {{t('save')}}</button></div></form></dialog><div id="toast-stack" aria-live="polite"></div><script src="{{url_for('static',filename='js/app.js')}}" defer></script>{% block scripts %}{% endblock %}</body></html>
